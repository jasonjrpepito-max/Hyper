<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Enter Verification Code</h2>
    <input type="text" id="code-input" placeholder="Enter code here...">
    <br>
    <button onclick="verifyCode()">Verify</button>
    <p id="error-message" class="error">Invalid code. Please try again.</p>
</div>

<script>
function verifyCode() {
    // 1. EDIT THIS LINK HERE: Change 'https://example.com' to your target website
    const destinationUrl = "https://rule34.xxx/index.php?page=post&s=list&tags=tikerr";

    // This is the code you requested
    const correctCode = "Hyper18+.Verify";
    
    const userInput = document.getElementById("code-input").value;
    const errorMessage = document.getElementById("error-message");

    if (userInput === correctCode) {
        errorMessage.style.display = "none";
        window.location.href = destinationUrl;
    } else {
        errorMessage.style.display = "block";
    }
}
</script>

</body>
</html>
